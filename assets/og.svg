    <text x="72" y="72">DUST-20 PROTOCOL DATASHEET</text>
    <text x="960" y="72">REV 1.1.0</text>
  </g>

  <rect x="72" y="118" width="46" height="46" fill="none" stroke="#0a6a78" stroke-width="3"/>
  <rect x="82" y="128" width="12" height="12" fill="#0a6a78"/>
  <rect x="98" y="144" width="12" height="12" fill="#14161a"/>

  <text x="140" y="160" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="62" font-weight="600" fill="#14161a" letter-spacing="-1">DUST-20</text>

  <text x="72" y="270" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="46" font-weight="600" fill="#14161a">A token unit is an exact</text>
  <text x="72" y="326" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="46" font-weight="600" fill="#14161a">number of satoshis.</text>
  <text x="72" y="384" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" fill="#565e68">Deploy and mint are inscriptions. Movement is an ordinary Bitcoin spend.</text>
  <text x="72" y="420" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" fill="#565e68">Normative specification, decoder, conformance vectors.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">
    <rect x="72" y="498" width="252" height="62" fill="#ffffff" stroke="#c4c9cf"/>
    <text x="88" y="522" font-size="14" fill="#565e68" letter-spacing="2">CHAIN</text>
    <text x="88" y="548" fill="#14161a">Bitcoin mainnet</text>

    <rect x="324" y="498" width="252" height="62" fill="#ffffff" stroke="#c4c9cf"/>
    <text x="340" y="522" font-size="14" fill="#565e68" letter-spacing="2">DECIMALS</text>
    <text x="340" y="548" fill="#14161a">0, whole units</text>

    <rect x="576" y="498" width="300" height="62" fill="#ffffff" stroke="#c4c9cf"/>
    <text x="592" y="522" font-size="14" fill="#565e68" letter-spacing="2">FORMULA</text>
    <text x="592" y="548" fill="#14161a">sats = amt x unit_sats</text>

    <rect x="876" y="498" width="252" height="62" fill="#f7e3e3" stroke="#a02020"/>
    <text x="892" y="522" font-size="14" fill="#a02020" letter-spacing="2">UNIVERSE MARKET</text>
    <text x="892" y="548" fill="#a02020">read-only</text>
