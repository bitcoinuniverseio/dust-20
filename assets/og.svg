<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="DUST-20 — tokens with Bitcoin at their core">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7eedb"/>
      <stop offset="100%" stop-color="#efe0c2"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b2f17"/>
      <stop offset="55%" stop-color="#b76c25"/>
      <stop offset="100%" stop-color="#d89a25"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="70" r="220" fill="#d89a25" opacity=".16"/>
  <circle cx="60" cy="560" r="180" fill="#b99252" opacity=".14"/>
  <rect x="80" y="86" width="150" height="52" rx="26" fill="url(#mark)"/>
  <text x="155" y="121" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="#fff9ee" letter-spacing="2">DUST-20</text>
  <text x="80" y="270" font-family="Georgia, serif" font-size="82" font-weight="700" fill="#3b2d19" letter-spacing="-3">Tokens with</text>
  <text x="80" y="356" font-family="Georgia, serif" font-size="82" font-weight="700" fill="#7b2f17" letter-spacing="-3">Bitcoin at their core.</text>
  <text x="80" y="432" font-family="Inter, system-ui, sans-serif" font-size="27" fill="#5a4630">Every unit tied to an exact number of satoshis.</text>
  <g font-family="ui-monospace, monospace" font-size="24" fill="#5a4630">
    <rect x="80" y="474" width="330" height="52" rx="12" fill="#fff9ee" stroke="#d7bf91"/>
    <text x="102" y="507">sats = amt × unit_sats</text>
    <rect x="432" y="474" width="404" height="52" rx="12" fill="#fff9ee" stroke="#d7bf91"/>
    <text x="454" y="507">max_sats = supply × unit_sats</text>
  </g>
  <text x="80" y="586" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#7a6444">bitcoinuniverseio.github.io/dust-20</text>
</svg>
