    <path d="M0 40.5h1200M0 80.5h1200M0 120.5h1200M0 160.5h1200M0 200.5h1200M0 240.5h1200M0 280.5h1200M0 320.5h1200M0 360.5h1200M0 400.5h1200M0 440.5h1200M0 480.5h1200M0 520.5h1200M0 560.5h1200M0 600.5h1200"/>
